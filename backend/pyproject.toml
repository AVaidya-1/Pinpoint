[project]
name = "pinpoint-backend"
version = "0.1.0"
description = "Pinpoint backend: PDF indexing, retrieval and Gemma 4 grounded answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pymupdf>=1.24",
  "pypdfium2>=4.30",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "google-genai>=1.0",
  "httpx>=0.27",
  "reportlab>=4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
tmp_path_retention_policy = "all"

[tool.hatch.build.targets.wheel]
packages = ["app"]
